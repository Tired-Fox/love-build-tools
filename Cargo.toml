[package]
name = "lbt"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.89"
dirs = "5.0.1"
indoc = "2.0.5"
regex = "1.11.0"
reqwest = { version = "0.12.8", features = ["blocking", "json"] }
strum = { version = "0.26.3", features = ["strum_macros", "derive"] }
tokio = { version = "1.40.0", features = ["macros", "process", "rt-multi-thread"] }
zip = "2.2.0"

serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

spinoff = "0.8.0"

clap = { version = "4.5.18", features = ["derive"] }
dialoguer = "0.11.0"
notify = "7.0.0"
