[package]
name = "love-version-manager"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lvm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.38", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.31"
log = "0.4.27"
regex = "1.11.1"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
strum = { version = "0.27.1", features = ["derive"] }
tokio = { version = "1.45.0", features = ["fs", "macros", "rt-multi-thread"] }
zip = "4.0.0"
